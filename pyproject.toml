[project]
name = "evm_contract_detector"
version = "0.1.0"
description = "Async Ethereum smart contract detector that detects token's symbol deployed across EVM chains."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath= ["."]
