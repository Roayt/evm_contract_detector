services:
 db:
  image: postgres:17
  environment: 
    POSTGRES_DB: evm_detector
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    API_READER_PASSWORD: ${API_READER_PASSWORD}
    DETECTOR_PASSWORD: ${DETECTOR_PASSWORD}
  volumes:
    - hheero:/var/lib/postgresql/data
    - ./initdb:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD-SHELL","pg_isready -U postgres -d evm_detector"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

 monitor:
    build:   .
    command: [
      "--rpc-url",  "${RPC_URL}",
      "--symbol", "${SYMBOL}",
    ]
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    depends_on:
      db:
       condition: service_healthy
    restart: unless-stopped 
 
 api:
    build:   .
    entrypoint: [
      "fastapi",
      "run",
      "api.py",
      "--host",
      "0.0.0.0",
      "--port",
      "8000"
    ]
    environment:
      DATABASE_API_URL: ${DOCKER_DATABASE_API_URL}
    depends_on:
      db:
       condition: service_healthy
    restart: unless-stopped 
    ports:
      - "127.0.0.1:8000:8000"

volumes:
 hheero: 


